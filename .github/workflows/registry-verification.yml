name: Registry Verification

# The smoke and consumer fixtures install @schmock/* from the public npm
# registry, so they verify what is PUBLISHED — not the change under review.
# Running them in the PR matrix would gate every pull request on the state of
# the registry, so they run here instead: automatically after a release is
# published, and on demand.
# GitHub registers release and dispatch workflows from the default branch only.
# This file must therefore be present on the repository's default branch,
# develop, before either trigger is available.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact released version to verify (for example, 2.3.0)"
        required: true
        type: string
      packages:
        description: "Space-separated fixture names (blank = all)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - smoke
          - consumer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13  # Match local dev version

      - name: Resolve exact released version
        id: exact-version
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          version="$(node scripts/smoke-tests/registry-fixture.mjs resolve-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Run ${{ matrix.suite }} verification
        env:
          SUITE: ${{ matrix.suite }}
          SCHMOCK_VERSION: ${{ steps.exact-version.outputs.version }}
          PACKAGES_INPUT: ${{ inputs.packages }}
        run: |
          if [[ "$PACKAGES_INPUT" == *$'\n'* || "$PACKAGES_INPUT" == *$'\r'* ]]; then
            echo "Package filters must be on one line." >&2
            exit 2
          fi
          packages=()
          if [[ -n "$PACKAGES_INPUT" ]]; then
            read -r -a packages <<< "$PACKAGES_INPUT"
          fi
          echo "::group::Running $SUITE verification"
          case "$SUITE" in
            smoke)
              bash scripts/smoke-tests/run-all.sh -- "${packages[@]}"
              ;;
            consumer)
              bash scripts/integration-tests/run-all.sh -- "${packages[@]}"
              ;;
          esac
          echo "::endgroup::"
